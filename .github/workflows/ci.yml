name: CI

# The repository is public and Actions minutes are free, so a pull request runs the
# oldest and newest supported interpreters and the full matrix runs on demand. The
# Docker jobs still run only when the files they cover change, because a full Docker
# build costs wall clock even when it costs no money. Pushes to main are not tested
# again: every merge comes from a pull request whose head already passed.
on:
  pull_request:
    paths-ignore:
      - "**.md"
      - "docs/**"
      - "openspec/**"
      - ".gitignore"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  # Which parts of the tree a pull request touches, so the Docker jobs below can skip.
  # A manual run reports everything as changed.
  changes:
    runs-on: ubuntu-latest
    outputs:
      gui: ${{ steps.filter.outputs.gui }}
      ai: ${{ steps.filter.outputs.ai }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - id: filter
        shell: bash
        run: |
          if [ "${{ github.event_name }}" != "pull_request" ]; then
            echo "gui=true" >> "$GITHUB_OUTPUT"
            echo "ai=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          changed="$(git diff --name-only "origin/${{ github.base_ref }}...HEAD")"
          printf '%s\n' "$changed"
          shared='^(pyproject\.toml|constraints\.txt|Dockerfile\.dev|compose\.yaml|\.github/workflows/ci\.yml|tests/conftest\.py|scripts/make_fixtures\.py)$'
          if printf '%s\n' "$changed" | grep -Eq "$shared|^autocut/gui/|^tests/unit/test_gui_|^tests/unit/test_cli_gui"; then
            echo "gui=true" >> "$GITHUB_OUTPUT"
          else
            echo "gui=false" >> "$GITHUB_OUTPUT"
          fi
          if printf '%s\n' "$changed" | grep -Eq "$shared|^autocut/core/(embeddings|tags|describe|similarity)\.py$|^autocut/core/providers/|^tests/unit/test_(embeddings|tags|describe|similarity)"; then
            echo "ai=true" >> "$GITHUB_OUTPUT"
          else
            echo "ai=false" >> "$GITHUB_OUTPUT"
          fi

  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # The oldest and newest interpreter join on a pull request; the full matrix
        # joins on a manual run.
        python: ${{ fromJSON(github.event_name == 'pull_request' && '["3.12", "3.14"]' || '["3.12", "3.13", "3.14"]') }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - name: Install ffmpeg
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg
      - name: ffmpeg version
        run: ffmpeg -hide_banner -version | head -1
      - name: Install project
        run: pip install -c constraints.txt -e ".[dev]"
      - name: Lint
        run: ruff check . && ruff format --check .
      # This job installs no Qt, so the GUI package's base classes would be Any and
      # strict mypy forbids subclassing Any. The gui job below type checks it with
      # PySide6 present; the venv checks everything at once.
      - name: Type check
        run: mypy autocut --exclude 'autocut/gui/'
      - name: Fixtures
        run: python scripts/make_fixtures.py
      - name: Tests
        if: matrix.python != '3.12'
        run: pytest -q
      - name: Tests with coverage
        if: matrix.python == '3.12'
        run: pytest -q --cov=autocut.core --cov=autocut.cli --cov-report=term --cov-fail-under=83

  # Fails the run on a known vulnerability in a resolved dependency, so a finding is a
  # deliberate, visible decision rather than something that quietly ships.
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - name: Install project
        run: pip install -c constraints.txt -e ".[dev,scenedetect]" pip-audit
      - name: Audit
        run: pip-audit --skip-editable

  # The embedding tests need torch, which the matrix job deliberately does not
  # install: the ai extra is optional and the default job stays light. This job
  # builds the second Docker target and runs only the tests marked "ai".
  ai:
    needs: changes
    if: needs.changes.outputs.ai == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - name: Build the ai image
        uses: docker/bake-action@v7
        with:
          files: compose.yaml
          targets: dev-ai
          load: true
          set: |
            *.cache-from=type=gha,scope=dev-ai
            *.cache-to=type=gha,mode=max,scope=dev-ai
      - name: Fixtures and ai tests
        run: docker compose run --rm dev-ai sh -c "python scripts/make_fixtures.py && pytest -q -m ai"

  # The GUI tests need PySide6 and the Qt system libraries, which the matrix job
  # deliberately does not install. This job builds the third Docker target and runs
  # only the tests marked "gui", with Qt on the offscreen platform.
  gui:
    needs: changes
    if: needs.changes.outputs.gui == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - name: Build the gui image
        uses: docker/bake-action@v7
        with:
          files: compose.yaml
          targets: dev-gui
          load: true
          set: |
            *.cache-from=type=gha,scope=dev-gui
            *.cache-to=type=gha,mode=max,scope=dev-gui
      - name: Type check the GUI package
        run: docker compose run --rm dev-gui sh -c "mypy autocut"
      - name: Fixtures and gui tests
        run: docker compose run --rm dev-gui sh -c "python scripts/make_fixtures.py && pytest -q -m gui"

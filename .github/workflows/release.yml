name: Release

# On demand only until milestone M6: `make dmg` is a placeholder that exits 1, so a
# tag trigger would only ever produce a failed run. Tags come back with the
# PyInstaller bundle (ADR 7).
on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to create, e.g. v0.6.0"
        required: true
        type: string

permissions:
  contents: write

jobs:
  dmg:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install ffmpeg
        run: brew install ffmpeg
      - name: Install project with GUI, AI, build and dev extras
        run: pip install -c constraints.txt -e ".[gui,ai,build,dev,dev-gui]"
      - name: Lint
        run: ruff check . && mypy autocut
      - name: Fixtures
        run: python scripts/make_fixtures.py
      - name: Tests
        run: pytest -q
      - name: Build app bundle
        run: make dmg
      - uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ inputs.tag }}
          target_commitish: ${{ github.sha }}
          files: dist/*.dmg
          body: |
            Unsigned build. On first launch, right-click the app and choose Open,
            or run `xattr -dr com.apple.quarantine /Applications/AutoCut.app`.

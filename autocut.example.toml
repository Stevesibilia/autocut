# AutoCut configuration. Copy to autocut.toml next to your project and edit.
# Every key is optional; defaults are defined in autocut/core/config.py.

[analysis]
sample_fps = 2.0
sample_long_side = 320
use_proxies = true
# auto | off | vaapi | videotoolbox. The decoder is chosen once per run, verified by
# decoding one frame of the first file, and demoted to software for the whole run with
# a single warning if that fails.
# "auto" selects videotoolbox on macOS and software everywhere else. It never selects
# vaapi: vaapi decodes correctly on Linux but measured slower than software for 2 fps
# sampling (one 4K clip: 3.9 s software, 9.0 s vaapi, 5.7 s with a full GPU filter
# chain), because most of the work is skipping frames and every decoded surface is
# copied back to system memory. Set "vaapi" explicitly if you measure a win on your
# own hardware. It never selects cuda, which is what ffmpeg's own -hwaccel auto chose
# on an AMD host before failing on every file.
hwaccel = "auto"
sprites = false       # thumbnail strips for GUI scrubbing
high_fps_threshold = 100.0   # at or above this fps, an unclassified file is called actioncam
fallback_fps = 25.0          # assumed frame rate for min scene length when ffprobe has none

[analysis.head_trim_seconds]
drone = 1.0
actioncam = 1.0
phone = 0.3
reflex = 0.5
generic = 0.5

# Force a class on files matching a glob (evaluated in order, last match wins).
# The glob is matched against the path relative to its source folder with fnmatch
# rules, not gitignore rules: "*" crosses directory separators, so "**" and "*"
# behave the same and "GoPro/*" already matches at any depth below the folder.
# [[analysis.class_overrides]]
# glob = "GoPro/**"
# source_class = "actioncam"

[weights]
sharpness = 1.0
# 0 by default: on well exposed footage clipping is the same on every segment, so
# weighting it ranks on noise. It stays a rejection rule.
exposure = 0.0
motion = 1.0
stability = 1.0
colorfulness = 0.5
aesthetic = 0.0
faces = 0.0

# Thresholds are defaults taken from the measured distribution of real footage, not
# guesses. Run scripts/metric_stats.py on a manifest to re-derive them for your own
# material. Each comment says what share of the 77 Sardinia segments falls below the
# value; the full table is in the m2-scoring-tuning tasks.
[rules]
min_motion = 0.015        # 6 of 77 segments below, 7.8%
shaky_min_motion = 0.04   # 20 of 77 below, 26.0%; under this a wobble is a still shot
min_stability = 0.71      # 8 of 77 segments below, 10.4%
max_clipped_fraction = 0.05

[rules.drone]
min_height_m = 5.0

[selection]
min_segment_seconds = 1.5
target_duration_seconds = 3.0   # fallback only: used by --duration and by a class with no base
max_clips = 40
diversity_lambda = 0.6      # the diversity slider: 0 ranks by score alone
max_clips_per_cluster = 2
min_temporal_gap_seconds = 60.0
cluster_threshold = 0.75    # combined similarity above which two clips are one cluster

# Clip length. Forty identical durations read as a slideshow, so each clip gets its own
# length from its class, its score and its neighbours. Run `autocut select --duration 3.0`
# for one length everywhere.
duration_min_seconds = 1.5
duration_max_seconds = 6.0
score_duration_range = [0.8, 1.2]   # multiplier at score 0 and at score 1
hero_share = 0.1            # top share by score that gets the bonus
hero_multiplier = 1.5
alternate_durations = true  # break runs of three clips in the same bucket
# target_total_seconds = 90.0   # scale every duration so the edit lands near this length
# One spot on one outing gives at most a few clips, however different the pixels look.
# Candidates without GPS belong to no place and are never held back by this.
place_radius_m = 150.0          # two candidates this close share a place, transitively
place_visit_gap_seconds = 7200.0  # a gap this long inside one place starts a new visit
max_clips_per_place = 3
max_share_per_tag = 0.5     # ceiling on one dominant tag's share of the final count
max_candidate_share = 0.5   # ceiling on max_clips as a share of the eligible candidates

snap_to_motion = true       # start the cut where movement begins
snap_window_seconds = 0.5   # how far the start may move to reach a motion minimum
snap_max_score_loss = 0.05  # mean score a snap may give up, as a share

# Base seconds per class, before the score scales them. An aerial needs longer to be read
# than an action shot. A class set to 0 falls back to target_duration_seconds.
[selection.duration_by_class]
drone = 4.0
actioncam = 2.0
phone = 2.5
reflex = 3.0
generic = 3.0

[selection.max_clips_per_file]
drone = 1
actioncam = 3
phone = 1
reflex = 2
generic = 1

# Floor on each class's share of the final count, so a mixed vacation does not
# become an all-aerial edit. Zero everywhere means no class is reserved slots.
[selection.min_share_per_class]
drone = 0.0
actioncam = 0.0
phone = 0.0
reflex = 0.0
generic = 0.0

[similarity]
visual_semantic = true   # CLIP embeddings, needs the ai extra
visual_fallback = true   # perceptual hash plus colour histogram
spatial = true
temporal = true
motion = true
histogram_bins = 8   # per channel buckets of the fallback colour histogram
# Share of the visual fallback signal from the perceptual hash; the rest is the
# colour histogram.
hash_share = 0.5
spatial_radius_m = 200.0   # GPS distance at which the spatial signal reaches 0
temporal_radius_s = 600.0  # time distance at which the temporal signal reaches 0
# Cosine similarity mapped to 0. Two unrelated holiday shots still score around 0.5
# against each other, so the useful range is the half above the floor.
semantic_floor = 0.5

# Relative weight of each similarity signal. A signal that cannot be computed for a
# pair, because one of the two has no GPS fix or no embedding, is left out of that
# pair's mean. The semantic signal replaces the visual hash for a pair rather than
# joining it, which is why the two carry the same weight.
[similarity.weights]
visual = 0.5
semantic = 0.5
spatial = 0.2
temporal = 0.2
motion = 0.1

# Zero-shot semantic tags, computed from the segment embeddings and these labels.
# Editing the groups and re-running "autocut tag" recomputes the tags in seconds and
# touches neither the embeddings nor the metrics.
[tags]
enabled = true
# Cosines are multiplied by this before the softmax. CLIP ships 100, the constant its
# contrastive loss was trained with, which over a handful of labels makes one label win
# with probability 1 and leaves the threshold deciding nothing.
logit_scale = 10.0
threshold = 0.2        # probability after the softmax over a group, its null prompt included
max_per_segment = 3    # across groups; the dominant tag is kept first

# Labels are grouped and each group is scored on its own, because a drone shot over a
# beach is a beach and is aerial, and one softmax over both makes them compete. Anything
# that can be true at the same time as another label belongs in another group.
#
# Every group carries a null_prompt. It joins the softmax and is never emitted: it is how
# a group says "none of these", and without it some label always wins.
#
# The primary group is the one whose top label names the exported clip. Exactly one group
# should be primary.
[[tags.groups]]
name = "subject"
prompt_template = "a photo of {label}"
null_prompt = "a photo"
primary = true
labels = [
  { label = "beach" },
  { label = "mountain" },
  { label = "city" },
  { label = "street" },
  { label = "indoor" },
  { label = "food" },
  { label = "people" },
]

[[tags.groups]]
name = "view"
prompt_template = "a photo of {label}"
null_prompt = "a photo taken at ground level"
# CLIP is sensitive to phrasing: "aerial" on its own encodes closer to an antenna than
# to a view from the air, so that label carries its own sentence.
labels = [
  { label = "aerial", prompt = "an aerial photo taken from a drone" },
  { label = "underwater" },
]

[[tags.groups]]
name = "light"
prompt_template = "a photo of {label}"
null_prompt = "a photo taken in ordinary daylight"
labels = [{ label = "sunset" }]

[export]
mode = "precise"      # or "fast" for keyframe aligned stream copy
codec = "libx264"
crf = 18
fps = "auto"          # dominant fps of the selected clips, or a number
max_width = 3840
max_height = 2160
pix_fmt = "yuv420p"
vertical_strategy = "exclude"   # exclude | blur_pad | center_crop
keep_rejects = false  # also export rejected segments into _rejects/
# Encoder thread pool size. Defaults to max(1, (analysis.workers or physical cores) // 2).
# workers = 3
# Put every clip on one frame, the smallest of their fitted sizes, so nothing is
# upscaled and the outputs can be joined without re-encoding. A render turns this on
# for the export it runs, whatever is set here.
uniform_frame = false

# A default export is silent and the soundtrack carries the sound. Set a class to false
# to keep its ambience.
[export.remove_audio]
drone = true
actioncam = true
phone = true
reflex = true
generic = true

# Half speed when the source runs at twice the target or more, by a whole ratio only,
# so every output frame is a frame the camera took. Slow motion always drops audio.
[export.slow_motion_auto]
drone = false
actioncam = true
phone = false
reflex = false
generic = false

# A .cube file per class, applied with lut3d. Off until log profiles are in use, and
# left commented out because TOML has no null: an empty string is a path, not "unset".
# [export.lut]
# drone = "/luts/dji-dlog.cube"

[export.lens_correction]
drone = false
actioncam = false
phone = false
reflex = false
generic = false

# The optional finished file: the exported clips joined by stream copy with the track
# over them, written beside _selects/. Hard cuts only; everything else stays in CapCut.
[render]
enabled = false             # true makes every export finish with a render
fade_out_seconds = 1.5      # the track fades over this at the end of the edit
filename = "montage.mp4"
audio_bitrate = "192k"

[providers]
cloud = true          # uses OPENROUTER_API_KEY from env or keychain when present
vision_model = "google/gemini-2.5-flash"
llm_model = "google/gemini-2.5-flash"
# Cloud descriptions: one request per segment, cached forever per model and prompt
# version. "candidates" is about 60 requests on a holiday folder and costs a few cents;
# "selected" describes only the final clips.
describe_scope = "candidates"
max_concurrency = 4   # requests in flight
max_retries = 4       # per request, on 429 and 5xx, with backoff 1, 2, 4, 8 s
max_failures = 8      # consecutive failures that stop the describe step
prompt_version = 1    # bump when the prompt wording changes; invalidates the cache
local_embeddings = true   # needs the ai extra; run "autocut doctor" to check
# Vision model as architecture/pretrained. Changing it recomputes the embeddings from
# the cached frames and leaves the metric arrays alone.
embedding_model = "ViT-B-32/laion2b_s34b_b79k"
embedding_batch_size = 16

[soundtrack]
variants = 3                 # 1 to 5
bpm_tolerance = 3.0
beat_multiples = [2, 4, 8]       # a clip is on the grid at this many beats
refine = true                # ask the text model to polish the template prompt
description_max_chars = 200
energy_bands = [0.34, 0.67]     # where the curve turns low to mid to high
default_profile = "upbeat folk"
# Suno's own section words. Here because the rules are Suno's and Suno changes them.
allowed_sections = [
  "intro", "verse", "verse 1", "verse 2", "verse 3",
  "pre-chorus", "chorus", "bridge", "solo", "break",
  "drop", "build", "transition", "outro", "end",
]

# Local hours, half open. Anything outside them is night.
[soundtrack.time_of_day]
morning = [5, 9]
daytime = [9, 17]
evening = [17, 21]

# The genre table, ordered specific to general. The first row whose every condition
# holds wins, and the report says which one it was, so a surprising genre traces to
# one row here. A row with no [when] block matches anything, which is why the last
# row is the fallback. Every field of a [when] block is optional. Instruments carry
# an adjective each, because Suno wants 'sweeping strings' rather than 'strings'.

[[soundtrack.genres]]
name = "surf rock"
genre = "surf rock"
instruments = ["twangy reverb guitar", "driving drums", "warm bass"]
bpm = [120, 140]
mood = ["sunny", "carefree"]
mood_alternates = ["breezy", "playful"]
instrument_alternates = ["shimmering tremolo guitar"]

[soundtrack.genres.when]
tags_dominant = ["beach"]
tags_any = ["underwater"]
energy = ["mid", "high"]

[[soundtrack.genres]]
name = "pop punk"
genre = "pop punk"
instruments = ["crunchy guitar", "fast drums", "punchy bass"]
bpm = [150, 175]
mood = ["restless", "bright"]
mood_alternates = ["urgent", "giddy"]
instrument_alternates = ["chugging guitar"]

[soundtrack.genres.when]
energy = ["high"]

[soundtrack.genres.when.class_min_share]
actioncam = 0.6

[[soundtrack.genres]]
name = "reggae and dub"
genre = "reggae dub"
instruments = ["skanking guitar", "deep dub bass", "loose drums"]
bpm = [70, 90]
mood = ["hazy", "unhurried"]
mood_alternates = ["drowsy", "warm"]
instrument_alternates = ["spring reverb guitar"]

[soundtrack.genres.when]
tags_dominant = ["beach"]
energy = ["low"]

[[soundtrack.genres]]

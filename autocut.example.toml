# AutoCut configuration. Copy to autocut.toml next to your project and edit.
# Every key is optional; defaults are defined in autocut/core/config.py.

[analysis]
sample_fps = 2.0
sample_long_side = 320
use_proxies = true
# auto | off | vaapi | videotoolbox. The decoder is chosen once per run, verified by
# decoding one frame of the first file, and demoted to software for the whole run with
# a single warning if that fails.
# "auto" selects videotoolbox on macOS and software everywhere else. It never selects
# vaapi: vaapi decodes correctly on Linux but measured slower than software for 2 fps
# sampling (one 4K clip: 3.9 s software, 9.0 s vaapi, 5.7 s with a full GPU filter
# chain), because most of the work is skipping frames and every decoded surface is
# copied back to system memory. Set "vaapi" explicitly if you measure a win on your
# own hardware. It never selects cuda, which is what ffmpeg's own -hwaccel auto chose
# on an AMD host before failing on every file.
hwaccel = "auto"
sprites = false       # thumbnail strips for GUI scrubbing

[analysis.head_trim_seconds]
drone = 1.0
actioncam = 1.0
phone = 0.3
reflex = 0.5
generic = 0.5

# Force a class on files matching a glob (evaluated in order, last match wins).
# The glob is matched against the path relative to its source folder with fnmatch
# rules, not gitignore rules: "*" crosses directory separators, so "**" and "*"
# behave the same and "GoPro/*" already matches at any depth below the folder.
# [[analysis.class_overrides]]
# glob = "GoPro/**"
# source_class = "actioncam"

[weights]
sharpness = 1.0
# 0 by default: on well exposed footage clipping is the same on every segment, so
# weighting it ranks on noise. It stays a rejection rule.
exposure = 0.0
motion = 1.0
stability = 1.0
colorfulness = 0.5
aesthetic = 0.0
faces = 0.0

# Thresholds are defaults taken from the measured distribution of real footage, not
# guesses. Run scripts/metric_stats.py on a manifest to re-derive them for your own
# material; the percentiles these correspond to are in the m2-scoring-tuning tasks.
[rules]
min_motion = 0.015        # pooled 8th percentile of segment motion
shaky_min_motion = 0.04   # pooled 27th; below this a wobble is reported as no_motion
min_stability = 0.71      # pooled 10th percentile of segment stability
max_clipped_fraction = 0.05

[rules.drone]
min_height_m = 5.0

[selection]
target_duration_seconds = 3.0
max_clips = 40
diversity_lambda = 0.6
max_clips_per_cluster = 2

[selection.max_clips_per_file]
drone = 1
actioncam = 3
phone = 1
reflex = 2
generic = 1

[export]
mode = "precise"      # or "fast" for keyframe aligned stream copy
codec = "libx264"
crf = 18
fps = "auto"          # dominant fps of the selected clips, or a number
max_width = 3840
max_height = 2160
pix_fmt = "yuv420p"
vertical_strategy = "exclude"   # exclude | blur_pad | center_crop

[export.remove_audio]
drone = true
actioncam = true
phone = false
reflex = false
generic = true

[providers]
cloud = true          # uses OPENROUTER_API_KEY from env or keychain when present
vision_model = "google/gemini-2.5-flash"
llm_model = "google/gemini-2.5-flash"
local_embeddings = true

[soundtrack]
variants = 3
bpm_tolerance = 3.0
beat_multiples = [2, 4, 8]

# Genre table: keys are material profiles, values feed the prompt generator.
[soundtrack.genres.aerial_landscape]
genre = "cinematic ambient"
instruments = "sweeping strings, soft piano"
bpm_range = "80-100"

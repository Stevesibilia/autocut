[[soundtrack.genres]]
name = "acoustic and ukulele pop"
genre = "acoustic pop"
instruments = ["warm ukulele", "brushed drums", "soft acoustic guitar"]
bpm = [95, 115]
mood = ["tender", "domestic"]

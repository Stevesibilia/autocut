[[soundtrack.genres]]
name = "country"
genre = "country"
instruments = ["twangy guitar", "shuffling drums", "walking bass"]
bpm = [100, 120]
mood = ["easygoing", "open"]
mood_alternates = ["homespun", "rolling"]

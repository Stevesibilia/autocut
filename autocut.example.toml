# Reverse geocoding through Nominatim: one request per place, cached forever, spaced
# to keep to the usage policy. False keeps places numeric and the run fully offline.
[places]
geocode = true
min_interval_s = 1.0
# user_agent = "autocut/0.6.0"   # defaults to autocut/<version>

# The window. Everything here is about the desktop application and is ignored by the
# commands. The theme is applied when the window opens, so a change takes effect at the
# next start; "system" reads the desktop palette once and picks dark or light from it.
[gui]
theme = "dark"                  # "dark", "light" or "system"
# slider_debounce_ms = 250
# grid_thumbnail_px = 196

# The analysis cache and the model weights are separate on purpose. The cache is about
# one project's footage and can live anywhere; a checkpoint is about this machine, and
# following the cache directory meant every project with its own cache downloaded its
# own 350 MB copy. Both default to the platform cache directory.
[cache]
# dir = "~/.cache/autocut"
# models_dir = "~/.cache/autocut"
# Recently read analysis cache entries kept in memory, read-only, across
# re-selections. 0 disables the in-memory cache and reads every entry from disk on
# every selection.
memory_entries = 256

# How long AutoCut waits for one external tool call before giving up on it, in seconds.
[timeouts]
ffprobe_s = 60.0             # one ffprobe call: a file, or an exported clip
hwaccel_probe_s = 20.0       # listing or verifying a hardware decoder
sample_read_s = 900.0        # reading the sampled frames ffmpeg writes during analysis
export_clip_s = 1800.0       # encoding one exported clip
montage_part_s = 300.0       # encoding one clip of the review montage
concat_s = 600.0             # joining already-encoded clips into a render or a montage
audio_decode_s = 300.0       # decoding the soundtrack for beat sync
telemetry_extract_s = 60.0   # extracting an embedded telemetry subtitle track
version_check_s = 10.0       # reading one external tool's version, for "autocut doctor"

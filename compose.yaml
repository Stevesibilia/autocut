services:
  dev:
    build:
      context: .
      dockerfile: Dockerfile.dev
      target: dev
    volumes:
      - .:/app
      - ${AUTOCUT_REAL_FOOTAGE:-/dev/null}:/footage:ro
    environment:
      AUTOCUT_REAL_FOOTAGE: ${AUTOCUT_REAL_FOOTAGE:+/footage}
    devices:
      - /dev/dri:/dev/dri
    command: pytest -q

  # The ai extra, for the tests marked "ai". The model cache is a named volume so
  # the checkpoint is downloaded once rather than on every run. No /dev/dri: this
  # target runs torch on the CPU and never asks for the GPU.
  dev-ai:
    build:
      context: .
      dockerfile: Dockerfile.dev
      target: ai
    volumes:
      - .:/app
      - autocut-models:/root/.cache/autocut
      - ${AUTOCUT_REAL_FOOTAGE:-/dev/null}:/footage:ro
    environment:
      AUTOCUT_REAL_FOOTAGE: ${AUTOCUT_REAL_FOOTAGE:+/footage}
    command: pytest -q -m ai

  # The gui extra, for the tests marked "gui". Offscreen, so no display is shared
  # into the container and no X socket is needed. No /dev/dri either: Qt renders
  # into memory here and the tests never decode video.
  dev-gui:
    build:
      context: .
      dockerfile: Dockerfile.dev
      target: gui
    volumes:
      - .:/app
      - ${AUTOCUT_REAL_FOOTAGE:-/dev/null}:/footage:ro
    environment:
      AUTOCUT_REAL_FOOTAGE: ${AUTOCUT_REAL_FOOTAGE:+/footage}
      QT_QPA_PLATFORM: offscreen
    command: pytest -q -m gui

volumes:
  autocut-models:

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "autocut"
version = "0.5.0"
description = "Select, trim, order and normalize vacation footage clips for CapCut."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Proprietary" }
authors = [{ name = "Stefano Sibilia" }]
dependencies = [
  "numpy>=1.26",
  "opencv-python-headless>=4.9",
  "scenedetect>=0.6.4",
  "librosa>=0.10",
  "pydantic>=2.7",
  "pydantic-settings>=2.3",
  "typer>=0.12",
  "rich>=13.7",
  "httpx>=0.27",
  "keyring>=25",
  "platformdirs>=4.2",
  "pillow>=10.3",
  "jinja2>=3.1",
]

[project.optional-dependencies]
# torch and torchvision move in lockstep: every torchvision release pins one exact
# torch version, so the two upper bounds have to be raised together. torch 2.13.0 and
# torchvision 0.28.0 (both 2026-07-08) publish wheels for cp311 through cp314 on
# manylinux_2_28_x86_64 and macosx_14_0_arm64, which are the two platforms this project
# targets. torch 2.14.0 exists but is one day old, which the dependency safety rule in
# AGENTS.md rules out. open_clip_torch is a pure Python wheel and pulls torchvision and
# timm itself; it is pinned here so the lockstep is visible in one place.
ai = [
  "torch>=2.13,<2.14",
  "torchvision>=0.28,<0.29",
  "open_clip_torch>=3.3,<3.4",
]
# PySide6 is a meta package pinning shiboken6, PySide6-Essentials and PySide6-Addons
# to its own exact version. 6.11.2 (2026-08-18) publishes cp310-abi3 wheels for
# manylinux_2_34_x86_64 and macosx_13_0_universal2 and declares >=3.10,<3.15, so all
# four of the Python versions this project supports get a wheel on both platforms
# this project targets. The abi3 tag means one wheel serves every interpreter, so the
# bound is on the Qt version rather than on the interpreter.
gui = [
  "PySide6>=6.11.2,<6.12",
]
dev = [
  "pytest>=8.2",
  "pytest-cov>=5.0",
  "ruff>=0.5",
  "mypy>=1.10",
  "types-Pillow",
]
# pytest-qt is not in "dev" because it refuses to load without a Qt binding: it fails
# the whole collection, not just the tests that need it, so a "dev" environment
# without PySide6 could not run any test at all. It lives in its own extra installed
# alongside "gui", which keeps the default matrix job and the dev container Qt free.
dev-gui = [
  "pytest-qt>=4.5",
]
build = [
  "pyinstaller>=6.9",
]

[project.scripts]
autocut = "autocut.cli.main:app"

[tool.hatch.build.targets.wheel]
packages = ["autocut"]
# The report template ships with the package: the renderer loads it from the
# installed tree, not from the source checkout. The GUI design system ships the
# same way: the window registers the fonts and renders the icons out of the
# installed tree, so a wheel without them opens with the platform fonts and no
# icons at all. The PyInstaller specification (ADR 7) has to collect the same
# directory.
artifacts = [
  "autocut/core/templates/*.j2",
  "autocut/gui/theme/assets/**",
]

[tool.hatch.build.targets.sdist]
include = [
  "autocut",
  "scripts",
  "tests",
  "SPEC.md",
  "AGENTS.md",
  "README.md",
  "THIRD_PARTY_LICENSES.md",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "N"]

[tool.mypy]
# Type checking targets 3.12 while the runtime floor stays 3.11: the numpy stubs
# use PEP 695 "type" statements, which mypy only parses at 3.12 and above. Code
# that is not valid on 3.11 is still caught by ruff (target-version py311) and by
# the 3.11 test job in CI.
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
  "private: needs clips in tests/fixtures/private",
  "real_footage: needs AUTOCUT_REAL_FOOTAGE",
  "ffmpeg: runs the ffmpeg binary",
  "ai: needs the ai extra, runs a real vision model",
  "gui: needs the gui extra, builds Qt widgets",
]

[build-system]
requires = ["hatchling>=1.32"]
build-backend = "hatchling.build"

[project]
name = "autocut"
version = "0.6.0"
description = "Select, trim, order and normalize vacation footage clips for CapCut."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "Proprietary" }
authors = [{ name = "Stefano Sibilia" }]
dependencies = [
  "numpy>=2.4",
  "opencv-python-headless>=5.0",
  "librosa>=1.0",
  "pydantic>=2.13",
  "pydantic-settings>=2.15",
  "typer>=0.27",
  "rich>=15.0",
  "httpx>=0.28",
  "keyring>=25.7",
  "platformdirs>=4.11",
  "pillow>=12.0",
  "jinja2>=3.1.6",
]

[project.optional-dependencies]
# torch and torchvision move in lockstep: every torchvision release pins one exact
# torch version, so the two upper bounds have to be raised together. torch 2.14.0 and
# torchvision 0.29.0 (both 2026-09-02) publish wheels for cp312 through cp314 on
# manylinux_2_28_x86_64 and macosx_14_0_arm64, which are the platforms this project
# targets now that the floor is 3.12. open_clip_torch is a pure Python wheel and pulls
# torchvision and timm itself; it is pinned here so the lockstep is visible in one place.
ai = [
  "torch>=2.14,<2.15",
  "torchvision>=0.29,<0.30",
  "open_clip_torch>=3.3,<3.4",
]
# PySide6 is a meta package pinning shiboken6, PySide6-Essentials and PySide6-Addons
# to its own exact version. 6.11.2 (2026-08-18) publishes cp310-abi3 wheels for
# manylinux_2_34_x86_64 and macosx_13_0_universal2 and declares >=3.10,<3.15, so every
# Python version this project supports gets a wheel on both platforms it targets. The
# abi3 tag means one wheel serves every interpreter, so the bound is on the Qt version
# rather than on the interpreter.
gui = [
  "PySide6>=6.11.2,<6.12",
]
dev = [
  "pytest>=9.1",
  "pytest-cov>=7.1",
  "ruff>=0.16",
  "mypy>=2.3",
  "uv>=0.12",
]
# The validation shot detector only. Pulls opencv-python next to the core's
# opencv-python-headless, so it stays out of the default install and out of the
# PyInstaller bundle. See ADR 11.
scenedetect = [
  "scenedetect>=0.7.1",
]
# pytest-qt is not in "dev" because it refuses to load without a Qt binding: it fails
# the whole collection, not just the tests that need it, so a "dev" environment
# without PySide6 could not run any test at all. It lives in its own extra installed
# alongside "gui", which keeps the default matrix job and the dev container Qt free.
dev-gui = [
  "pytest-qt>=4.5",
]
build = [
  "pyinstaller>=6.22",
]

[project.scripts]
autocut = "autocut.cli.main:app"

[tool.hatch.build.targets.wheel]
packages = ["autocut"]
# The report template ships with the package: the renderer loads it from the
# installed tree, not from the source checkout. The GUI design system ships the
# same way: the window registers the fonts and renders the icons out of the
# installed tree, so a wheel without them opens with the platform fonts and no
# icons at all. The PyInstaller specification (ADR 7) has to collect the same
# directory.
artifacts = [
  "autocut/core/templates/*.j2",
  "autocut/core/models/*",
  "autocut/gui/theme/assets/**",
]

[tool.hatch.build.targets.sdist]
include = [
  "autocut",
  "scripts",
  "tests",
  "SPEC.md",
  "AGENTS.md",
  "README.md",
  "THIRD_PARTY_LICENSES.md",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "N"]

[tool.mypy]
# Type checking targets 3.12, matching the runtime floor: the numpy stubs use PEP 695
# "type" statements, which mypy only parses at 3.12 and above.
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
  "private: needs clips in tests/fixtures/private",
  "real_footage: needs AUTOCUT_REAL_FOOTAGE",
  "ffmpeg: runs the ffmpeg binary",
  "ai: needs the ai extra, runs a real vision model",
  "gui: needs the gui extra, builds Qt widgets",
]
